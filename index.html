<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tamil Obby Journey</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111214">
  <style>
    /* 🎮 ROBLOX DARK THEME VARIABLES */
    :root {
      --primary: #00b0ff;      /* Roblox Blue */
      --primary-dark: #007bb5; /* 3D Shadow Blue */
      --bg: #111214;           /* Deep Space Grey */
      --card-bg: #232527;      /* Panel Grey */
      --text: #ffffff;         /* Pure White Text */
      --text-dim: #babbbe;     /* Silver Text */
      --accent: #00e676;       /* Neon Green */
      --accent-dark: #00a152;  /* 3D Shadow Green */
      --danger: #ff4a4a;       /* Error Red */
      --danger-dark: #cc0000;  /* 3D Shadow Red */
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 🧱 CHUNKY TOP BAR */
    header { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #000; z-index: 10; }
    h1 { margin: 0; font-size: 1.6rem; color: var(--text); font-weight: 800; letter-spacing: 1px;}
    
    /* 🕹️ 3D BLOCKY BUTTONS */
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; transition: all 0.1s; }
    
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 5px 0 var(--primary-dark); }
    .btn-primary:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--primary-dark); }

    .btn-success { background: var(--accent); color: white; font-size: 1.2rem; padding: 15px 30px; box-shadow: 0 5px 0 var(--accent-dark); }
    .btn-success:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--accent-dark); }
    
    .btn-outline { background: var(--card-bg); border: 2px solid var(--text-dim); color: var(--text); box-shadow: 0 4px 0 #000; }
    .btn-outline:active { transform: translateY(4px); box-shadow: 0 0px 0 #000; }

    .view { display: none; flex: 1; padding: 20px; overflow-y: auto; }
    .view.active { display: flex; flex-direction: column; }

    /* 🗺️ LEVEL MAP (Dashboard) */
    .grid-30 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; width: 100%; }
    .day-card { border-radius: 12px; padding: 20px; text-align: center; font-weight: bold; cursor: pointer; border: 3px solid #000; transition: transform 0.1s; }
    .day-card.unlocked { background: var(--card-bg); color: var(--text); box-shadow: 0 6px 0 var(--primary-dark); border-color: var(--primary); }
    .day-card.locked { background: #1a1a1a; color: #4a4a4a; cursor: not-allowed; border-color: #000; }
    .day-card.unlocked:active { transform: translateY(6px); box-shadow: 0 0px 0 var(--primary-dark); }

    /* 🛠️ WORKSPACES */
    .workspace { flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; height: 100%; min-height: 0; }
    #workspace-learn { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
    #workspace-test { display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 16px; border: 4px solid #000; padding: 20px;}

    /* 📚 SIDEBAR */
    .sidebar { background: var(--card-bg); border-radius: 12px; border: 3px solid #000; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;}
    .group-btn { padding: 15px; text-align: left; background: var(--bg); border: 2px solid transparent; border-radius: 8px; cursor: pointer; font-size: 1.1rem; color: var(--text-dim); }
    .group-btn.active { background: #1a364a; border-color: var(--primary); color: white; font-weight: bold; }
    
    .main-area { display: flex; flex-direction: column; gap: 15px; min-height: 0;}
    .toolbar { display: flex; gap: 10px; justify-content: center; }
    .letter-btn { font-size: 2rem; padding: 10px 30px; border-radius: 10px; border: 3px solid #000; background: var(--card-bg); color: var(--text); cursor: pointer; box-shadow: 0 4px 0 #000;}
    .letter-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #000; }
    .letter-btn.active { border-color: var(--primary); background: var(--primary); color: white; box-shadow: 0 4px 0 var(--primary-dark); }
    
    /* 🖌️ NEON CANVAS */
    .canvas-container { flex: 1; background: var(--bg); border-radius: 16px; border: 4px solid #000; position: relative; display: flex; justify-content: center; align-items: center; min-height: 0; touch-action: none; width: 100%; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);}
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 16px; z-index: 2; }
    .ghost-letter { position: absolute; font-size: 35vh; color: #1c1e21; z-index: 1; pointer-events: none; font-weight: bold; text-shadow: 2px 2px 0px #000;}
    
    .action-bar { display: flex; gap: 20px; justify-content: center; padding: 10px 0; }
    .btn-speak { background: var(--primary); color: white; font-size: 1.8rem; width: 65px; height: 65px; border-radius: 12px; border: 3px solid #000; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 var(--primary-dark);}
    .btn-speak:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--primary-dark); }
    
    .btn-clear { background: var(--danger); color: white; border: 3px solid #000; border-radius: 12px; padding: 0 25px; font-size: 1.2rem; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 var(--danger-dark);}
    .btn-clear:active { transform: translateY(5px); box-shadow: 0 0px 0 var(--danger-dark); }

    /* ⚔️ BOSS FIGHT (Test Elements) */
    .test-stage { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; height: 100%; justify-content: center;}
    .test-stage.active { display: flex; }
    .test-title { color: var(--primary); font-size: 2.5rem; margin-bottom: 5px; font-weight: 900; text-transform: uppercase; text-shadow: 2px 2px 0 #000;}
    .test-subtitle { font-size: 1.2rem; color: var(--text-dim); margin-bottom: 30px; }
    .test-choices { display: flex; gap: 25px; justify-content: center; }
    .choice-btn { font-size: 4.5rem; padding: 25px 45px; border-radius: 16px; border: 4px solid #000; background: var(--card-bg); color: var(--text); cursor: pointer; box-shadow: 0 8px 0 #000; transition: 0.1s;}
    .choice-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #000; background: var(--bg); }
    .progress-dots { display: flex; gap: 10px; margin-bottom: 25px; }
    .dot { width: 18px; height: 18px; border-radius: 4px; background: #000; border: 2px solid var(--text-dim);}
    .dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent);}
    .feedback-text { font-size: 1.8rem; font-weight: 900; margin-top: 25px; min-height: 45px; text-shadow: 2px 2px 0 #000;}
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">TAMIL OBBY</h1>
    <div id="header-actions">
      <button class="btn btn-outline" onclick="document.documentElement.requestFullscreen().catch(()=>{})">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- View: Dashboard -->
  <div id="view-dashboard" class="view active">
    <div style="margin-bottom: 20px; text-align: center;">
      <h2 style="font-weight: 900; color: var(--primary); font-size: 2rem;">SELECT STAGE</h2>
    </div>
    <div class="grid-30" id="day-grid"></div>
  </div>

  <!-- View: Dynamic Learning Workspace -->
  <div id="view-workspace" class="view">
    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
      <button class="btn btn-outline" onclick="showDashboard()">← Leave Game</button>
      <div>
        <button class="btn btn-primary" id="btn-mode-learn" onclick="switchMode('learn')" style="margin-right: 15px;">📖 Practice</button>
        <button class="btn btn-outline" id="btn-mode-test" onclick="switchMode('test')">⚔️ Boss Fight</button>
      </div>
    </div>

    <!-- Learn Workspace -->
    <div class="workspace" id="workspace-learn">
      <div class="sidebar" id="group-list"></div>
      <div class="main-area">
        <div class="toolbar" id="letter-toolbar"></div>
        <div class="canvas-container" id="learn-canvas-wrapper">
          <div class="ghost-letter" id="ghost-char">அ</div>
          <canvas id="learnCanvas"></canvas>
        </div>
        <div class="action-bar">
          <button class="btn-clear" onclick="clearCanvas('learn')">Erase</button>
          <button class="btn-speak" onclick="playAudio(currentLetter)">🔊</button>
        </div>
      </div>
    </div>

    <!-- Test Workspace -->
    <div class="workspace" id="workspace-test">
      <!-- Game 1: Audio Hunt -->
      <div id="game1" class="test-stage">
        <h2 class="test-title">Phase 1: Sound Radar 🎧</h2>
        <p class="test-subtitle">Listen to the prompt and tap the matching block</p>
        <div class="progress-dots" id="g1-progress"></div>
        <button class="btn-speak" style="width: 90px; height: 90px; font-size: 3rem; margin-bottom: 40px; border-radius: 20px;" onclick="playAudio(testTarget)">🔊</button>
        <div class="test-choices" id="g1-choices"></div>
        <p class="feedback-text" id="g1-feedback"></p>
      </div>

      <!-- Game 2: Speed Tap -->
      <div id="game2" class="test-stage">
        <h2 class="test-title">Phase 2: Speed Run ⚡</h2>
        <p class="test-subtitle" id="g2-instruction" style="color: var(--accent); font-weight: bold; font-size: 1.5rem;">Find the target!</p>
        <div class="progress-dots" id="g2-progress"></div>
        <div class="test-choices" id="g2-choices"></div>
        <p class="feedback-text" id="g2-feedback"></p>
      </div>

      <!-- Game 3: Memory Trace -->
      <div id="game3" class="test-stage">
        <h2 class="test-title">Final Boss: Memory Draw ✍️</h2>
        <p class="test-subtitle">Draw the letter on the dark screen!</p>
        <div class="progress-dots" id="g3-progress"></div>
        <div style="display:flex; align-items:center; gap: 30px; width: 100%; height: 50vh;">
          <button class="btn-speak" style="width: 90px; height: 90px; font-size: 3rem; border-radius: 20px;" onclick="playAudio(testTarget)">🔊</button>
          <div class="canvas-container" id="test-canvas-wrapper" style="height: 100%;">
            <canvas id="testCanvas"></canvas>
          </div>
        </div>
        <div class="action-bar" style="margin-top: 25px;">
          <button class="btn-clear" onclick="clearCanvas('test')">Erase</button>
          <button class="btn btn-primary" onclick="checkMemoryTrace()">Check Drawing</button>
        </div>
      </div>

      <!-- Game 3 Reveal -->
      <div id="game3-reveal" class="test-stage">
        <h2 class="test-title">Is it a match?</h2>
        <div style="font-size: 12rem; color: var(--primary); font-weight: 900; text-shadow: 4px 4px 0 #000;" id="g3-reveal-letter">அ</div>
        <div style="display: flex; gap: 30px; margin-top: 30px;">
          <button class="btn btn-clear" style="padding: 20px 40px; font-size: 1.5rem;" onclick="finishMemoryTrace(false)">❌ Retry</button>
          <button class="btn btn-success" style="padding: 20px 40px; font-size: 1.5rem;" onclick="finishMemoryTrace(true)">✅ Got It!</button>
        </div>
      </div>

      <!-- Victory Screen -->
      <div id="victory-stage" class="test-stage">
        <div style="font-size: 6rem; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.2);">🏆</div>
        <h2 class="test-title" id="victory-title" style="font-size: 3.5rem; color: var(--accent);">STAGE CLEARED!</h2>
        <p class="test-subtitle" id="victory-subtitle" style="font-size: 1.5rem; color: var(--text);">You unlocked the next level.</p>
        <button class="btn btn-primary" style="font-size: 1.5rem; padding: 20px 50px; margin-top: 20px;" onclick="unlockAndReturn()">Collect Badge & Return</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    let activeDay = 1;
    let currentLetter = "அ";
    let testTarget = "";
    let testRound = 0;
    
    let unlockedDays = JSON.parse(localStorage.getItem('tamilUnlocked')) || [1];

    function renderDashboard() {
      const grid = document.getElementById('day-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const isUnlocked = unlockedDays.includes(i);
        const div = document.createElement('div');
        div.className = `day-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        
        let subtext = daysData[i] ? daysData[i].shortName : "Locked";
        if(!isUnlocked) subtext = "Locked";

        div.innerHTML = `LEVEL ${i}<br><span style="font-size: 0.9rem; font-weight: normal; color: ${isUnlocked ? 'var(--text)' : '#4a4a4a'};">${subtext}</span>`;
        if (isUnlocked && daysData[i] && daysData[i].groups) {
          div.onclick = () => openDay(i);
        }
        grid.appendChild(div);
      }
    }

    function showDashboard() {
      document.getElementById('view-dashboard').classList.add('active');
      document.getElementById('view-workspace').classList.remove('active');
      document.getElementById('header-title').innerText = "TAMIL OBBY";
      renderDashboard();
    }

    function openDay(dayNum) {
      activeDay = dayNum;
      document.getElementById('view-dashboard').classList.remove('active');
      document.getElementById('view-workspace').classList.add('active');
      document.getElementById('header-title').innerText = daysData[dayNum].title.toUpperCase();
      switchMode('learn');
      loadGroup(0);
      setTimeout(() => resizeCanvas('learn'), 100);
    }

    function switchMode(mode) {
      const learnWs = document.getElementById('workspace-learn');
      const testWs = document.getElementById('workspace-test');
      if (mode === 'learn') {
        learnWs.style.display = 'grid'; testWs.style.display = 'none';
        document.getElementById('btn-mode-learn').className = 'btn btn-primary';
        document.getElementById('btn-mode-test').className = 'btn btn-outline';
        setTimeout(() => resizeCanvas('learn'), 50);
      } else {
        learnWs.style.display = 'none'; testWs.style.display = 'flex';
        document.getElementById('btn-mode-learn').className = 'btn btn-outline';
        document.getElementById('btn-mode-test').className = 'btn btn-primary';
        startTestEngine();
      }
    }

    function loadGroup(index) {
      const data = daysData[activeDay];
      const groupList = document.getElementById('group-list');
      groupList.innerHTML = '';
      
      data.groups.forEach((g, idx) => {
        const btn = document.createElement('button');
        btn.className = `group-btn ${idx === index ? 'active' : ''}`;
        btn.innerHTML = `<strong>${g.name}</strong><br><span style="font-size:0.9rem; opacity: 0.8;">${g.desc}</span>`;
        btn.onclick = () => loadGroup(idx);
        groupList.appendChild(btn);
      });

      const tb = document.getElementById('letter-toolbar');
      tb.innerHTML = '';
      data.groups[index].letters.forEach((l, i) => {
        const btn = document.createElement('button');
        btn.className = `letter-btn ${i === 0 ? 'active' : ''}`;
        btn.innerText = l;
        btn.onclick = () => {
          document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLetter = l;
          document.getElementById('ghost-char').innerText = l;
          clearCanvas('learn');
          playAudio(l);
        };
        tb.appendChild(btn);
        if (i === 0) btn.click();
      });
    }

    function playAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ta-IN'; utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }
    }

    const canvases = {
      learn: { el: document.getElementById('learnCanvas'), ctx: document.getElementById('learnCanvas').getContext('2d', {willReadFrequently:true}), drawing: false },
      test: { el: document.getElementById('testCanvas'), ctx: document.getElementById('testCanvas').getContext('2d', {willReadFrequently:true}), drawing: false }
    };

    function resizeCanvas(type) {
      const wrapper = document.getElementById(`${type}-canvas-wrapper`);
      if(!wrapper || wrapper.clientWidth === 0) return;
      canvases[type].el.width = wrapper.clientWidth;
      canvases[type].el.height = wrapper.clientHeight;
      canvases[type].ctx.lineCap = 'round';
      canvases[type].ctx.lineJoin = 'round';
      canvases[type].ctx.lineWidth = 18; // Thicker Neon Line
    }
    window.addEventListener('resize', () => { resizeCanvas('learn'); resizeCanvas('test'); });

    function attachCanvasEvents(type) {
      const c = canvases[type].el;
      const ctx = canvases[type].ctx;
      const getPos = (e) => { const rect = c.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; };

      c.addEventListener('pointerdown', (e) => { 
        canvases[type].drawing = true; 
        ctx.beginPath(); 
        ctx.moveTo(getPos(e).x, getPos(e).y); 
        e.preventDefault(); 
      });
      c.addEventListener('pointermove', (e) => { 
        if (!canvases[type].drawing) return; 
        ctx.strokeStyle = '#00b0ff'; // Neon Blue Drawing Line!
        ctx.lineTo(getPos(e).x, getPos(e).y); 
        ctx.stroke(); 
        e.preventDefault(); 
      });
      window.addEventListener('pointerup', () => canvases[type].drawing = false);
    }
    attachCanvasEvents('learn'); attachCanvasEvents('test');
    function clearCanvas(type) { canvases[type].ctx.clearRect(0, 0, canvases[type].el.width, canvases[type].el.height); }

    function showStage(stageId) {
      document.querySelectorAll('.test-stage').forEach(el => el.classList.remove('active'));
      document.getElementById(stageId).classList.add('active');
    }
    function updateDots(containerId, total, current) {
      const c = document.getElementById(containerId); c.innerHTML = '';
      for(let i=0; i<total; i++) { const d = document.createElement('div'); d.className = `dot ${i < current ? 'filled' : ''}`; c.appendChild(d); }
    }

    function startTestEngine() { testRound = 0; runGame1(); }

    function runGame1() {
      const data = daysData[activeDay];
      if(testRound >= data.g1Rounds) { testRound = 0; return runGame2(); }
      showStage('game1'); updateDots('g1-progress', data.g1Rounds, testRound);
      
      testTarget = data.allLetters[Math.floor(Math.random() * data.allLetters.length)];
      let choices = [testTarget];
      while(choices.length < 3) {
        let r = data.allLetters[Math.floor(Math.random() * data.allLetters.length)];
        if(!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      const cont = document.getElementById('g1-choices'); cont.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn'; btn.innerText = c;
        btn.onclick = () => {
          const fb = document.getElementById('g1-feedback');
          if(c === testTarget) {
            fb.style.color = "var(--accent)"; fb.innerText = "⭐ PERFECT HIT!";
            testRound++; setTimeout(runGame1, 1000);
          } else {
            fb.style.color = "var(--danger)"; fb.innerText = "MISS! LISTEN AGAIN."; playAudio(testTarget);
          }
        };
        cont.appendChild(btn);
      });
      document.getElementById('g1-feedback').innerText = "";
      playAudio(testTarget);
    }

    function runGame2() {
      const data = daysData[activeDay];
      if(testRound >= data.g2Rounds) { testRound = 0; return runGame3(); }
      showStage('game2'); updateDots('g2-progress', data.g2Rounds, testRound);
      
      const pair = data.g2Pairs[Math.floor(Math.random() * data.g2Pairs.length)];
      
      if(activeDay === 1) {
        const isAskingLong = Math.random() > 0.5;
        testTarget = isAskingLong ? pair[1] : pair[0];
        document.getElementById('g2-instruction').innerText = isAskingLong ? "Tap the LONG sound (நெடில்)" : "Tap the SHORT sound (குறில்)";
      } else if(activeDay === 2) {
        testTarget = pair[0];
        document.getElementById('g2-instruction').innerText = "Find the sound with the DOT! (புள்ளி)";
      }

      document.getElementById('g2-feedback').innerText = "";
      const cont = document.getElementById('g2-choices'); cont.innerHTML = '';
      
      let displayPair = [...pair].sort(() => Math.random() - 0.5);
      displayPair.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn'; btn.innerText = c;
        btn.onclick = () => {
          const fb = document.getElementById('g2-feedback');
          if(c === testTarget) {
            fb.style.color = "var(--accent)"; fb.innerText = "⚡ SPEED BONUS!"; testRound++; setTimeout(runGame2, 1000);
          } else {
            fb.style.color = "var(--danger)"; fb.innerText = "WRONG BLOCK! TRY AGAIN."; playAudio(testTarget);
          }
        };
        cont.appendChild(btn);
      });
      playAudio(testTarget);
    }

    function runGame3() {
      const data = daysData[activeDay];
      if(testRound >= data.g3Rounds) return showVictory();
      showStage('game3'); updateDots('g3-progress', data.g3Rounds, testRound);
      
      testTarget = data.allLetters[Math.floor(Math.random() * data.allLetters.length)];
      setTimeout(() => resizeCanvas('test'), 100); clearCanvas('test'); playAudio(testTarget);
    }

    function checkMemoryTrace() { showStage('game3-reveal'); document.getElementById('g3-reveal-letter').innerText = testTarget; playAudio(testTarget); }
    function finishMemoryTrace(isSuccess) { if(isSuccess) { testRound++; runGame3(); } else { showStage('game3'); clearCanvas('test'); playAudio(testTarget); } }

    function showVictory() {
      showStage('victory-stage');
      const nextDay = activeDay + 1;
      document.getElementById('victory-title').innerText = `LEVEL ${activeDay} CLEARED!`;
      
      if(daysData[nextDay]) {
        document.getElementById('victory-subtitle').innerText = `You unlocked Level ${nextDay}: ${daysData[nextDay].shortName}`;
        if(!unlockedDays.includes(nextDay)) {
          unlockedDays.push(nextDay);
          localStorage.setItem('tamilUnlocked', JSON.stringify(unlockedDays));
        }
      } else {
        document.getElementById('victory-subtitle').innerText = "Developer is building the next zone...";
      }
    }
    function unlockAndReturn() { showDashboard(); }

    renderDashboard();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
